[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modvege-wn"
version = "0.1.0"
description = "Daily pasture biomass and harvest simulation adapted from ModVege"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ModVege-WN contributors"}]
keywords = ["grassland", "pasture", "crop-model", "ModVege"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
modvege-wn = "modvege_wn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
