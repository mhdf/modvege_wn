name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check command line example
        run: |
          python -m modvege_wn examples/weather.csv --cut 2020-01-25 --soil 20 40 20 1.0 --groups 1 0 0 0 --ni 0.85 --output-dir outputs/ci-smoke
          python -c "from pathlib import Path; assert Path('outputs/ci-smoke/daily.csv').is_file(); assert Path('outputs/ci-smoke/harvests.csv').is_file()"
